# Render Free Web Service (Docker). Free instances sleep and have ephemeral disk:
# use Neo4j AuraDB Free for the graph; ChromaDB under storage_data/ is lost on redeploy (re-ingest or seed).
services:
  - type: web
    name: linkforge-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - {key: NEO4J_URI, sync: false}
      - {key: NEO4J_USER, sync: false}
      - {key: NEO4J_PASSWORD, sync: false}
      - {key: NEO4J_DATABASE, sync: false}
      - {key: GROQ_API_KEY, sync: false}
      - {key: FRONTEND_URL, sync: false}
      - {key: CONTACT_EMAIL, sync: false}
      - {key: ADMIN_API_KEY, sync: false}
      - {key: LLM_PROVIDER, value: groq}



