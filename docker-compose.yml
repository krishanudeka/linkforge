# Local Neo4j Community (only needed if you are NOT using AuraDB Free)
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: linkforge-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
    volumes:
      - ./storage_data/neo4j_data:/data
      - ./storage_data/neo4j_logs:/logs
